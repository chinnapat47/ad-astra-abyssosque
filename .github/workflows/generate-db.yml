name: Build Genshin Wiki Database

on:
  workflow_dispatch: # กดรันเองได้จากหน้าเว็บ
  push:
    paths:
      - 'build-db.js'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install genshin-db & Generate Data
        run: |
          npm install genshin-db@latest
          node build-db.js

      - name: Commit generated genshin_data.js to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add genshin_data.js
          git diff --staged --quiet || git commit -m "Auto-generate Genshin Wiki DB"
          git push
